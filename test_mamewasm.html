<!doctype html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>MAME WASM - Test</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #f0f0f0;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas.emscripten {
            border: 0px none;
            background-color: black;
            margin-top: 20px;
        }

        #status {
            font-weight: bold;
            color: #00bcd4;
            margin: 10px;
        }

        #output {
            width: 95%;
            height: 500px;
            background: #333;
            border: 1px solid #555;
            color: #0f0;
            font-family: monospace;
            overflow-y: scroll;
            padding: 10px;
            font-size: 12px;
            margin-bottom: 20px;
        }

        #controls {
            display: flex;
            gap: 10px;
            align-items: center;
            margin: 15px 0;
            padding: 15px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
        }

        #controls label {
            color: #aaa;
            font-size: 14px;
        }

        #driver-input {
            background: #333;
            color: #f0f0f0;
            border: 1px solid #555;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            width: 150px;
        }

        #rom-file {
            background: #333;
            color: #f0f0f0;
            border: 1px solid #555;
            padding: 6px;
            border-radius: 4px;
            font-size: 13px;
        }

        #load-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
        }

        #load-btn:hover {
            background: #45a049;
        }

        #load-btn:disabled {
            background: #555;
            cursor: not-allowed;
        }

        #rom-status {
            color: #aaa;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <h1>MAME WASM Test</h1>

    <div id="controls">
        <label for="js-input">WASM JS:</label>
        <input type="text" id="js-input" value="mametiny.js" placeholder="e.g. mamesupracan.js">
        <label for="driver-input">Driver:</label>
        <input type="text" id="driver-input" value="" placeholder="e.g. pacman, supracan">
        <label for="extra-args">Extra Args:</label>
        <input type="text" id="extra-args" value="" placeholder="e.g. -cart game">
        <label for="rom-file">ROM:</label>
        <input type="file" id="rom-file" accept=".zip,.7z,.rar,.chd" multiple>
        <button id="load-btn" onclick="loadRomAndRestart()">Load &amp; Run</button>
        <button id="clear-btn" style="background:#f44336" onclick="clearSettings()">Clear Settings</button>
        <span id="rom-status">Select ROM file(s)</span>
    </div>

    <div id="status">Select a ROM file and click "Load & Run"</div>
    <progress value="0" max="100" id="progress" hidden=1></progress>

    <div id="welcome" style="text-align:center;color:#aaa;margin:40px 0;">
        <p>Select a ROM file (.zip, .7z, .rar, .chd) and enter the driver name, then click "Load &amp; Run".</p>
        <p>The driver name is auto-filled from the ROM filename.</p>
    </div>

    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>

    <h3>Console Output</h3>
    <textarea id="output" readonly></textarea>

    <script type='text/javascript'>
        var statusElement = document.getElementById('status');
        var progressElement = document.getElementById('progress');
        var outputElement = document.getElementById('output');
        var jsInput = document.getElementById('js-input');
        var driverInput = document.getElementById('driver-input');
        var extraArgsInput = document.getElementById('extra-args');
        var romFileInput = document.getElementById('rom-file');
        var loadBtn = document.getElementById('load-btn');
        var romStatus = document.getElementById('rom-status');

        // Restore UI state
        var storedJs = sessionStorage.getItem('mame_js') || 'mametiny.js';
        jsInput.value = storedJs;
        var storedArgs = sessionStorage.getItem('mame_args') || '';
        extraArgsInput.value = storedArgs;
        var storedDriver = sessionStorage.getItem('mame_driver');

        function log(msg, type) {
            var prefix = type === 'err' ? '[ERROR] ' : '';
            outputElement.value += prefix + msg + "\n";
            outputElement.scrollTop = outputElement.scrollHeight;
            console.log(prefix + msg);
        }

        // IndexedDB for storing ROM data
        var DB_NAME = 'MameWasmDB';
        var DB_VERSION = 1;
        var STORE_NAME = 'roms';

        function openDB() {
            return new Promise(function(resolve, reject) {
                var req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onupgradeneeded = function(e) {
                    var db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME);
                    }
                };
                req.onsuccess = function(e) { resolve(e.target.result); };
                req.onerror = function(e) { reject(e.target.error); };
            });
        }

        function storeRoms(files) {
            return new Promise(function(resolve, reject) {
                var readers = [];
                var filesRead = 0;
                var fileData = [];

                if (files.length === 0) return resolve();

                for (var i = 0; i < files.length; i++) {
                    (function(file) {
                        var reader = new FileReader();
                        reader.onload = function(e) {
                            fileData.push({ name: file.name, data: e.target.result });
                            filesRead++;
                            if (filesRead === files.length) {
                                // All files read into memory, now save to DB in one transaction
                                openDB().then(function(db) {
                                    var tx = db.transaction(STORE_NAME, 'readwrite');
                                    var store = tx.objectStore(STORE_NAME);
                                    store.clear();
                                    
                                    var romList = [];
                                    fileData.forEach(function(item) {
                                        store.put(item.data, 'romData_' + item.name);
                                        romList.push(item.name);
                                    });
                                    store.put(romList, 'romList');
                                    
                                    tx.oncomplete = function() { resolve(); };
                                    tx.onerror = function(e) { reject(e.target.error); };
                                }).catch(reject);
                            }
                        };
                        reader.onerror = function() { reject('Failed to read file: ' + file.name); };
                        reader.readAsArrayBuffer(file);
                    })(files[i]);
                }
            });
        }

        // Define Module BEFORE mametiny.js loads
        window.Module = {
            noInitialRun: false,
            preRun: [],
            postRun: [],
            print: (function () {
                return function (text) {
                    if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                    console.log(text);
                    outputElement.value += text + "\n";
                    outputElement.scrollTop = outputElement.scrollHeight;
                };
            })(),
            printErr: function (text) {
                if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                console.error(text);
                outputElement.value += "[ERR] " + text + "\n";
                outputElement.scrollTop = outputElement.scrollHeight;
            },
            canvas: (function () {
                var canvas = document.getElementById('canvas');
                canvas.addEventListener("webglcontextlost", function (e) { alert('WebGL context lost. Reload the page.'); e.preventDefault(); }, false);
                return canvas;
            })(),
            setStatus: function (text) {
                if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
                if (text === Module.setStatus.last.text) return;
                statusElement.innerHTML = text;
            },
            totalDependencies: 0,
            monitorRunDependencies: function (left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
            }
        };

        // Use a synchronous ROM load via IndexedDB sync API
        // Since IndexedDB is async, we use noInitialRun + run() approach
        // But since run() may not be exported, we use preRun with sync XHR fallback
        var romReady = false;
        var romName = '';
        var romData = null;

        // Read driver and args from sessionStorage (sync)
        var storedDriver = sessionStorage.getItem('mame_driver');
        var storedArgs = sessionStorage.getItem('mame_args') || '';
        
        if (storedDriver) {
            Module.arguments = [storedDriver, '-verbose', '-window', '-video', 'soft', '-resolution', '640x480', '-rompath', '/roms'];
            
            // Append extra args if present
            if (storedArgs) {
                var parts = storedArgs.split(/\s+/);
                parts.forEach(function(p) {
                    if (p.trim()) Module.arguments.push(p.trim());
                });
            }
        }

        // Try to load ROM from IndexedDB
        loadStoredRoms().then(function(roms) {
            if (roms && roms.length > 0) {
                document.getElementById('welcome').style.display = 'none';
                log('📂 Files currently in memory: ' + roms.map(r => r.name).join(', '));
                
                // Extra check: is the cart file here?
                if (storedArgs.indexOf('-cart') !== -1) {
                    var cartMatch = storedArgs.match(/-cart\s+([^\s]+)/);
                    if (cartMatch) {
                        var cartPath = cartMatch[1];
                        var cartName = cartPath.split('/').pop();
                        var found = roms.some(r => r.name === cartName || r.name === cartName + '.zip');
                        if (!found) {
                            log('⚠️ WARNING: Cartridge "' + cartName + '" not found in mounted files!', 'err');
                        }
                    }
                }
            }
        }).catch(function() {});

        Module.preRun.push(function() {
            Module.addRunDependency('rom');
            loadStoredRoms().then(function(roms) {
                if (roms && roms.length > 0) {
                    document.getElementById('welcome').style.display = 'none';
                    try { FS.mkdir('/roms'); } catch (ex) {}
                    
                    roms.forEach(function(rom) {
                        FS.writeFile('/roms/' + rom.name, new Uint8Array(rom.data));
                        log('✅ Mounted ' + rom.name + ' to /roms/' + rom.name);
                    });
                }
                Module.removeRunDependency('rom');
            }).catch(function(err) {
                log('❌ Error loading ROMs: ' + err);
                Module.removeRunDependency('rom');
            });
        });

        window.onerror = function (event, source, lineno, colno, error) {
            Module.setStatus('Exception thrown, see JavaScript console');
            var msg = "window.onerror: " + event + "\n";
            if (source) msg += "Source: " + source + ":" + lineno + ":" + colno + "\n";
            if (error && error.stack) msg += "Stack:\n" + error.stack + "\n";
            outputElement.value += "\n[FATAL ERROR]\n" + msg + "\n";
            outputElement.scrollTop = outputElement.scrollHeight;
        };

        function loadStoredRoms() {
            return openDB().then(function(db) {
                return new Promise(function(resolve, reject) {
                    var tx = db.transaction(STORE_NAME, 'readonly');
                    var listReq = tx.objectStore(STORE_NAME).get('romList');
                    listReq.onsuccess = function() {
                        var list = listReq.result;
                        if (!list) return resolve([]);
                        
                        var results = [];
                        var loaded = 0;
                        list.forEach(function(name) {
                            var dataReq = tx.objectStore(STORE_NAME).get('romData_' + name);
                            dataReq.onsuccess = function() {
                                results.push({ name: name, data: dataReq.result });
                                loaded++;
                                if (loaded === list.length) resolve(results);
                            };
                        });
                    };
                    listReq.onerror = function() { reject('No ROM list found'); };
                });
            });
        }

        function loadRomAndRestart() {
            var files = romFileInput.files;
            if (files.length === 0) {
                romStatus.textContent = 'Please select ROM file(s) first';
                romStatus.style.color = '#f44336';
                return;
            }

            var driver = driverInput.value.trim().toLowerCase();
            var jsFile = jsInput.value.trim();
            
            if (!driver) {
                alert('Please enter a Driver name (e.g. supracan)');
                return;
            }
            if (!jsFile) {
                alert('Please enter the WASM JS filename (e.g. mamesupracan.js)');
                return;
            }

            romStatus.textContent = 'Loading ' + files.length + ' file(s)...';
            romStatus.style.color = '#00bcd4';
            loadBtn.disabled = true;

            var jsFile = jsInput.value.trim() || 'mametiny.js';
            if (!jsFile.endsWith('.js')) jsFile += '.js';
            
            var extraArgs = extraArgsInput.value.trim();

            sessionStorage.setItem('mame_driver', driver);
            sessionStorage.setItem('mame_js', jsFile);
            sessionStorage.setItem('mame_args', extraArgs);
            
            storeRoms(files).then(function() {
                window.location.reload();
            }).catch(function(err) {
                romStatus.textContent = 'Failed to store ROMs: ' + err;
                romStatus.style.color = '#f44336';
                loadBtn.disabled = false;
            });
        }

        function clearSettings() {
            sessionStorage.clear();
            window.location.reload();
        }

        // Prevent MAME from stealing keys when typing in input boxes
        [jsInput, driverInput, extraArgsInput].forEach(function(el) {
            el.addEventListener('keydown', function(e) {
                e.stopPropagation();
            }, true);
            el.addEventListener('keyup', function(e) {
                e.stopPropagation();
            }, true);
        });

        romFileInput.addEventListener('change', function() {
            var files = this.files;
            if (files.length > 0) {
                // Only auto-fill if the driver input is currently empty
                if (!driverInput.value.trim()) {
                    var name = files[0].name.replace(/\.(zip|7z|rar|chd)$/i, '').toLowerCase();
                    driverInput.value = name;
                }
                romStatus.textContent = 'Selected ' + files.length + ' file(s).';
                romStatus.style.color = '#aaa';
            }
        });
        // Dynamic Script Loader with Error Handling
        (function() {
            log('🚀 Initializing environment...');
            log('📁 Target JS: ' + storedJs);
            log('🎮 Target Driver: ' + (storedDriver || '(none)'));
            log('⚙️ Arguments: ' + JSON.stringify(Module.arguments));

            var script = document.createElement('script');
            script.async = true;
            script.type = 'text/javascript';
            
            script.onload = function() {
                log('✅ Script ' + storedJs + ' loaded successfully.');
            };
            
            script.onerror = function() {
                log('❌ FAILED to load script: ' + storedJs + '. Please check if the file exists in the root directory.', 'err');
                statusElement.innerHTML = '<span style="color:red">Error: ' + storedJs + ' not found!</span>';
            };
            
            script.src = storedJs;
            document.body.appendChild(script);
        })();
    </script>
</body>

</html>
