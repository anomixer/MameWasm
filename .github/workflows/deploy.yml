name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'build.ps1'
      - 'build-linux.ps1'
      - 'custom_targets/**'
      - 'test_*.html'
      - 'server.py'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.35

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc g++ git

      - name: Clone MAME source
        run: |
          git clone --depth 1 --branch mame0287 https://github.com/mamedev/mame.git mame

      - name: Copy custom targets
        run: |
          mkdir -p mame/scripts/target/mame
          cp custom_targets/*.lua mame/scripts/target/mame/ 2>/dev/null || true
          cp custom_targets/*.lst mame/src/mame/ 2>/dev/null || true

      - name: Generate build files
        run: |
          cd mame
          make -j$(nproc) TOOLS=1 genie TARGET=mame SUBTARGET=tiny
          cd ..

      - name: Debug - list generated files
        run: |
          echo "=== Build directory structure ==="
          find mame/build/projects -type d 2>/dev/null | head -30
          echo "=== All generated files ==="
          find mame/build/projects -type f 2>/dev/null | head -50

      - name: Patch build files
        run: |
          # Find the actual build directory
          BUILD_DIR=$(find mame/build/projects -type d -name "mametiny" | head -1)
          if [ -z "$BUILD_DIR" ]; then
            echo "ERROR: No mametiny build directory found!"
            find mame/build -type d | head -30
            exit 1
          fi
          echo "Patching files in: $BUILD_DIR"
          cd "$BUILD_DIR"
          # Patch all generated files
          find . -type f | while read f; do
            # Fix $(EMSCRIPTEN) path
            sed -i "s|\$(EMSCRIPTEN)|${EMSDK}/upstream/emscripten|g" "$f"
            # Fix $(2) escaping
            sed -i 's|\$(2)|\$\$(2)|g' "$f"
            # Fix ERRNO_CODES
            sed -i "s|DEFAULT_LIBRARY_FUNCS_TO_INCLUDE=\['[^']*ERRNO_CODES[^']*'\]|DEFAULT_LIBRARY_FUNCS_TO_INCLUDE=['\$\$ERRNO_CODES']|g" "$f"
            # Add SDLMAME_EMSCRIPTEN
            sed -i 's|-DNDEBUG -DCRLF=2 -DLSB_FIRST|-DNDEBUG -DCRLF=2 -DLSB_FIRST -DSDLMAME_EMSCRIPTEN|g' "$f"
          done
          # Remove duplicate empty.o rules
          for f in $(find . -name "precompile.ninja"); do
            awk '/^# custom build rules/{skip=1} /^# build files/{skip=1} /^# FILE:/{skip=1} /^build empty.o/{skip=1} /^  /{if(skip)next} {skip=0;print}' "$f" > "${f}.tmp" && mv "${f}.tmp" "$f"
          done
          cd ../../../../..

      - name: Build MAME tiny
        run: |
          cd mame
          emmake make -j$(nproc) TARGET=mame SUBTARGET=tiny \
            LDFLAGS="-s ALLOW_MEMORY_GROWTH=1 -s INITIAL_MEMORY=536870912 -s MAXIMUM_MEMORY=4GB -s DISABLE_EXCEPTION_CATCHING=0" \
            DEBUG=0 SYMBOLS=0 NO_USE_MIDI=1 NO_USE_PORTAUDIO=1 NO_USE_PULSEAUDIO=1 NO_USE_SDL2=1 NO_USE_SYSTEM_LIB_ZLIB=1 NO_USE_SYSTEM_LIB_JPEG=1 NO_USE_SYSTEM_LIB_FLAC=1 NO_USE_SYSTEM_LIB_SQLITE3=1
          cd ..

      - name: Find build artifacts
        run: |
          echo "=== Searching for build artifacts ==="
          find mame/build -name "mametiny.js" -o -name "mametiny.wasm" 2>/dev/null
          echo "=== Directory structure ==="
          find mame/build/projects/sdl/mametiny -maxdepth 3 -type d 2>/dev/null

      - name: Prepare deployment
        run: |
          mkdir -p deploy
          # Find and copy JS and WASM files
          JS_FILE=$(find mame/build -name "mametiny.js" -type f | head -1)
          WASM_FILE=$(find mame/build -name "mametiny.wasm" -type f | head -1)
          if [ -n "$JS_FILE" ]; then
            cp "$JS_FILE" deploy/mametiny.js
            echo "Copied JS from: $JS_FILE"
          else
            echo "ERROR: mametiny.js not found!"
            exit 1
          fi
          if [ -n "$WASM_FILE" ]; then
            cp "$WASM_FILE" deploy/mametiny.wasm
            echo "Copied WASM from: $WASM_FILE"
          else
            echo "ERROR: mametiny.wasm not found!"
            exit 1
          fi
          cp test_mamewasm.html deploy/index.html
          cp test_emularity.html deploy/emularity.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
