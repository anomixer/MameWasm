<!doctype html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>MAME WASM - Vanilla Test</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #f0f0f0;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas.emscripten {
            border: 0px none;
            background-color: black;
            margin-top: 20px;
        }

        #status {
            font-weight: bold;
            color: #00bcd4;
            margin: 10px;
        }

        #output {
            width: 90%;
            height: 200px;
            background: #333;
            border: 1px solid #555;
            color: #0f0;
            font-family: monospace;
            overflow-y: scroll;
            padding: 10px;
        }
    </style>
</head>

<body>
    <h1>MAME WASM Vanilla Test</h1>
    <div id="status">Downloading...</div>
    <progress value="0" max="100" id="progress" hidden=1></progress>

    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>

    <h3>Console Output</h3>
    <textarea id="output" readonly></textarea>

    <script type='text/javascript'>
        var statusElement = document.getElementById('status');
        var progressElement = document.getElementById('progress');
        var outputElement = document.getElementById('output');

        var Module = {
            // 1. We hook into preRun to wait for the ROM to download before starting MAME
            preRun: [],
            postRun: [],
            print: (function () {
                return function (text) {
                    if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                    console.log(text);
                    outputElement.value += text + "\n";
                    outputElement.scrollTop = outputElement.scrollHeight; // auto scroll
                };
            })(),
            printErr: function (text) {
                if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                console.error(text);
                outputElement.value += "[ERR] " + text + "\n";
                outputElement.scrollTop = outputElement.scrollHeight;
            },
            canvas: (function () {
                var canvas = document.getElementById('canvas');
                canvas.addEventListener("webglcontextlost", function (e) { alert('WebGL context lost. You will need to reload the page.'); e.preventDefault(); }, false);
                return canvas;
            })(),
            setStatus: function (text) {
                if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
                if (text === Module.setStatus.last.text) return;
                statusElement.innerHTML = text;
            },
            totalDependencies: 0,
            monitorRunDependencies: function (left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
            },
            // This function is called by the runtime to check for external data files
            // But since we are manually handling it, we use logic below.

            arguments: [
                'robby',          // Driver name
                '-verbose',
                '-window',
                '-video', 'soft', // Software rendering
                '-resolution', '640x480',
                '-rompath', '/roms' // Tell MAME to look in our virtual folder
            ]
        };

        // Manually handle the ROM download and "Mounting"
        // In Emscripten, we write the file to the MEMFS virtual filesystem.
        Module.preRun.push(function () {
            Module.addRunDependency('robby_rom'); // Pause runtime start

            var xhr = new XMLHttpRequest();
            xhr.open('GET', 'robby.zip', true);
            xhr.responseType = 'arraybuffer';
            xhr.onload = function (e) {
                if (this.status == 200) {
                    console.log("Downloaded robby.zip");
                    try {
                        FS.mkdir('/roms'); // Create a virtual directory
                    } catch (e) { } // ignore if exists

                    // Write the file to the virtual filesystem
                    FS.writeFile('/roms/robby.zip', new Uint8Array(this.response));

                    outputElement.value += "✅ Mounted robby.zip to /roms/robby.zip\n";
                } else {
                    outputElement.value += "❌ Failed to download robby.zip\n";
                }
                Module.removeRunDependency('robby_rom'); // Resume runtime start
            };
            xhr.onerror = function () {
                outputElement.value += "❌ Network error downloading robby.zip\n";
                Module.removeRunDependency('robby_rom');
            };

            outputElement.value += "⬇️  Downloading robby.zip...\n";
            xhr.send();
        });

        Module.setStatus('Downloading...');
        window.onerror = function (event) {
            Module.setStatus('Exception thrown, see JavaScript console');
            Module.setStatus = function (text) {
                if (text) Module.printErr('[post-exception status] ' + text);
            };
        };
    </script>
    <script async type="text/javascript" src="mame.js"></script>
</body>

</html>
