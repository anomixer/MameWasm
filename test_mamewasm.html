<!doctype html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>MAME WASM - Test</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #f0f0f0;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas.emscripten {
            border: 0px none;
            background-color: black;
            margin-top: 20px;
        }

        #status {
            font-weight: bold;
            color: #00bcd4;
            margin: 10px;
        }

        #output {
            width: 95%;
            height: 500px;
            background: #333;
            border: 1px solid #555;
            color: #0f0;
            font-family: monospace;
            overflow-y: scroll;
            padding: 10px;
            font-size: 12px;
            margin-bottom: 20px;
        }

        #controls {
            display: flex;
            gap: 10px;
            align-items: center;
            margin: 15px 0;
            padding: 15px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
        }

        #controls label {
            color: #aaa;
            font-size: 14px;
        }

        #driver-input {
            background: #333;
            color: #f0f0f0;
            border: 1px solid #555;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            width: 150px;
        }

        #rom-file {
            background: #333;
            color: #f0f0f0;
            border: 1px solid #555;
            padding: 6px;
            border-radius: 4px;
            font-size: 13px;
        }

        #load-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
        }

        #load-btn:hover {
            background: #45a049;
        }

        #load-btn:disabled {
            background: #555;
            cursor: not-allowed;
        }

        #rom-status {
            color: #aaa;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <h1>MAME WASM Test</h1>

    <div id="controls">
        <label for="driver-input">Driver:</label>
        <input type="text" id="driver-input" value="" placeholder="e.g. pacman, robby">
        <label for="rom-file">ROM:</label>
        <input type="file" id="rom-file" accept=".zip,.7z,.rar,.chd">
        <button id="load-btn" onclick="loadRomAndRestart()">Load &amp; Run</button>
        <span id="rom-status">Select a ROM file</span>
    </div>

    <div id="status">Select a ROM file and click "Load & Run"</div>
    <progress value="0" max="100" id="progress" hidden=1></progress>

    <div id="welcome" style="text-align:center;color:#aaa;margin:40px 0;">
        <p>Select a ROM file (.zip, .7z, .rar, .chd) and enter the driver name, then click "Load &amp; Run".</p>
        <p>The driver name is auto-filled from the ROM filename.</p>
    </div>

    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>

    <h3>Console Output</h3>
    <textarea id="output" readonly></textarea>

    <script type='text/javascript'>
        var statusElement = document.getElementById('status');
        var progressElement = document.getElementById('progress');
        var outputElement = document.getElementById('output');
        var driverInput = document.getElementById('driver-input');
        var romFileInput = document.getElementById('rom-file');
        var loadBtn = document.getElementById('load-btn');
        var romStatus = document.getElementById('rom-status');

        function log(msg) {
            outputElement.value += msg + "\n";
            outputElement.scrollTop = outputElement.scrollHeight;
        }

        // IndexedDB for storing ROM data
        var DB_NAME = 'MameWasmDB';
        var DB_VERSION = 1;
        var STORE_NAME = 'roms';

        function openDB() {
            return new Promise(function(resolve, reject) {
                var req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onupgradeneeded = function(e) {
                    var db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME);
                    }
                };
                req.onsuccess = function(e) { resolve(e.target.result); };
                req.onerror = function(e) { reject(e.target.error); };
            });
        }

        function storeRom(name, data) {
            return openDB().then(function(db) {
                return new Promise(function(resolve, reject) {
                    var tx = db.transaction(STORE_NAME, 'readwrite');
                    tx.objectStore(STORE_NAME).put(data, 'romData');
                    tx.objectStore(STORE_NAME).put(name, 'romName');
                    tx.oncomplete = function() { resolve(); };
                    tx.onerror = function(e) { reject(e.target.error); };
                });
            });
        }

        // Define Module BEFORE mametiny.js loads
        // Always start with noInitialRun, we'll call Module.run() manually after loading ROM
        window.Module = {
            noInitialRun: true,
            preRun: [],
            postRun: [],
            print: (function () {
                return function (text) {
                    if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                    console.log(text);
                    outputElement.value += text + "\n";
                    outputElement.scrollTop = outputElement.scrollHeight;
                };
            })(),
            printErr: function (text) {
                if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                console.error(text);
                outputElement.value += "[ERR] " + text + "\n";
                outputElement.scrollTop = outputElement.scrollHeight;
            },
            canvas: (function () {
                var canvas = document.getElementById('canvas');
                canvas.addEventListener("webglcontextlost", function (e) { alert('WebGL context lost. Reload the page.'); e.preventDefault(); }, false);
                return canvas;
            })(),
            setStatus: function (text) {
                if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
                if (text === Module.setStatus.last.text) return;
                statusElement.innerHTML = text;
            },
            totalDependencies: 0,
            monitorRunDependencies: function (left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
            }
        };

        // Load stored ROM and start MAME
        loadStoredRom().then(function(rom) {
            if (rom.name && rom.data) {
                document.getElementById('welcome').style.display = 'none';
                Module.preRun.push(function() {
                    try { FS.mkdir('/roms'); } catch (ex) {}
                    FS.writeFile('/roms/' + rom.name, new Uint8Array(rom.data));
                    log('✅ Mounted ' + rom.name + ' to /roms/' + rom.name);
                });
                Module.arguments = [rom.name.replace(/\.(zip|7z|rar|chd)$/i, '').toLowerCase(), '-verbose', '-window', '-video', 'soft', '-resolution', '640x480', '-rompath', '/roms'];
                // Start MAME now
                if (Module.run) {
                    Module.run();
                }
            }
        }).catch(function() {
            // No stored ROM, keep noInitialRun=true
        });

        window.onerror = function (event, source, lineno, colno, error) {
            Module.setStatus('Exception thrown, see JavaScript console');
            var msg = "window.onerror: " + event + "\n";
            if (source) msg += "Source: " + source + ":" + lineno + ":" + colno + "\n";
            if (error && error.stack) msg += "Stack:\n" + error.stack + "\n";
            outputElement.value += "\n[FATAL ERROR]\n" + msg + "\n";
            outputElement.scrollTop = outputElement.scrollHeight;
        };

        function loadStoredRom() {
            return openDB().then(function(db) {
                return new Promise(function(resolve, reject) {
                    var tx = db.transaction(STORE_NAME, 'readonly');
                    var nameReq = tx.objectStore(STORE_NAME).get('romName');
                    var dataReq = tx.objectStore(STORE_NAME).get('romData');
                    nameReq.onsuccess = function() {
                        dataReq.onsuccess = function() {
                            resolve({ name: nameReq.result, data: dataReq.result });
                        };
                        dataReq.onerror = function(e) { reject(e.target.error); };
                    };
                    nameReq.onerror = function(e) { reject(e.target.error); };
                });
            });
        }

        function loadRomAndRestart() {
            var file = romFileInput.files[0];
            if (!file) {
                romStatus.textContent = 'Please select a ROM file first';
                romStatus.style.color = '#f44336';
                return;
            }

            var driver = driverInput.value.trim().toLowerCase();
            if (!driver) {
                romStatus.textContent = 'Please enter a driver name';
                romStatus.style.color = '#f44336';
                return;
            }

            romStatus.textContent = 'Loading ' + file.name + '...';
            romStatus.style.color = '#00bcd4';
            loadBtn.disabled = true;

            var reader = new FileReader();
            reader.onload = function(e) {
                storeRom(file.name, e.target.result).then(function() {
                    window.location.reload();
                }).catch(function(err) {
                    romStatus.textContent = 'Failed to store ROM: ' + err;
                    romStatus.style.color = '#f44336';
                    loadBtn.disabled = false;
                });
            };
            reader.onerror = function() {
                romStatus.textContent = 'Failed to read file';
                romStatus.style.color = '#f44336';
                log('❌ Failed to read ' + file.name);
                loadBtn.disabled = false;
            };
            reader.readAsArrayBuffer(file);
        }

        romFileInput.addEventListener('change', function() {
            var file = this.files[0];
            if (file) {
                var name = file.name.replace(/\.(zip|7z|rar|chd)$/i, '').toLowerCase();
                driverInput.value = name;
                romStatus.textContent = 'Ready: ' + file.name + ' (driver: ' + name + ')';
                romStatus.style.color = '#aaa';
            }
        });
    </script>
    <script async type="text/javascript" src="mametiny.js"></script>
</body>

</html>
