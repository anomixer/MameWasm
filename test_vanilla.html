<!doctype html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>MAME WASM - Vanilla Test</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #f0f0f0;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas.emscripten {
            border: 0px none;
            background-color: black;
            margin-top: 20px;
        }

        #status {
            font-weight: bold;
            color: #00bcd4;
            margin: 10px;
        }

        #output {
            width: 95%;
            height: 500px;
            background: #333;
            border: 1px solid #555;
            color: #0f0;
            font-family: monospace;
            overflow-y: scroll;
            padding: 10px;
            font-size: 12px;
            margin-bottom: 20px;
        }

        #controls {
            display: flex;
            gap: 10px;
            align-items: center;
            margin: 15px 0;
            padding: 15px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
        }

        #controls label {
            color: #aaa;
            font-size: 14px;
        }

        #driver-input {
            background: #333;
            color: #f0f0f0;
            border: 1px solid #555;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            width: 150px;
        }

        #rom-file {
            background: #333;
            color: #f0f0f0;
            border: 1px solid #555;
            padding: 6px;
            border-radius: 4px;
            font-size: 13px;
        }

        #load-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
        }

        #load-btn:hover {
            background: #45a049;
        }

        #load-btn:disabled {
            background: #555;
            cursor: not-allowed;
        }

        #rom-status {
            color: #aaa;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <h1>MAME WASM Vanilla Test</h1>

    <div id="controls">
        <label for="driver-input">Driver:</label>
        <input type="text" id="driver-input" value="robby" placeholder="e.g. pacman, robby">
        <label for="rom-file">ROM:</label>
        <input type="file" id="rom-file" accept=".zip">
        <button id="load-btn" onclick="loadRomAndRestart()">Load &amp; Run</button>
        <span id="rom-status">Select a ROM file</span>
    </div>

    <div id="status">Click "Load & Run" to start</div>
    <progress value="0" max="100" id="progress" hidden=1></progress>

    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>

    <h3>Console Output</h3>
    <textarea id="output" readonly></textarea>

    <script type='text/javascript'>
        var statusElement = document.getElementById('status');
        var progressElement = document.getElementById('progress');
        var outputElement = document.getElementById('output');
        var driverInput = document.getElementById('driver-input');
        var romFileInput = document.getElementById('rom-file');
        var loadBtn = document.getElementById('load-btn');
        var romStatus = document.getElementById('rom-status');

        var Module = {
            preRun: [],
            postRun: [],
            print: (function () {
                return function (text) {
                    if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                    console.log(text);
                    outputElement.value += text + "\n";
                    outputElement.scrollTop = outputElement.scrollHeight;
                };
            })(),
            printErr: function (text) {
                if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                console.error(text);
                outputElement.value += "[ERR] " + text + "\n";
                outputElement.scrollTop = outputElement.scrollHeight;
            },
            canvas: (function () {
                var canvas = document.getElementById('canvas');
                canvas.addEventListener("webglcontextlost", function (e) { alert('WebGL context lost. You will need to reload the page.'); e.preventDefault(); }, false);
                return canvas;
            })(),
            setStatus: function (text) {
                if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
                if (text === Module.setStatus.last.text) return;
                statusElement.innerHTML = text;
            },
            totalDependencies: 0,
            monitorRunDependencies: function (left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
            }
        };

        function log(msg) {
            outputElement.value += msg + "\n";
            outputElement.scrollTop = outputElement.scrollHeight;
        }

        function loadRomAndRestart() {
            var file = romFileInput.files[0];
            if (!file) {
                romStatus.textContent = 'Please select a ROM file first';
                romStatus.style.color = '#f44336';
                return;
            }

            var driver = driverInput.value.trim().toLowerCase();
            if (!driver) {
                romStatus.textContent = 'Please enter a driver name';
                romStatus.style.color = '#f44336';
                return;
            }

            // Auto-fill driver from filename if empty
            if (!driver) {
                driver = file.name.replace(/\.zip$/i, '').toLowerCase();
                driverInput.value = driver;
            }

            romStatus.textContent = 'Loading ' + file.name + '...';
            romStatus.style.color = '#00bcd4';
            loadBtn.disabled = true;

            var reader = new FileReader();
            reader.onload = function(e) {
                try {
                    FS.mkdir('/roms');
                } catch (ex) {}

                FS.writeFile('/roms/' + file.name, new Uint8Array(e.target.result));
                log('✅ Mounted ' + file.name + ' to /roms/' + file.name);

                romStatus.textContent = 'ROM loaded, starting ' + driver + '...';
                romStatus.style.color = '#4CAF50';

                // Set MAME arguments
                Module.arguments = [
                    driver,
                    '-verbose',
                    '-window',
                    '-video', 'soft',
                    '-resolution', '640x480',
                    '-rompath', '/roms'
                ];

                // Start MAME
                Module.callMain(Module.arguments);

                loadBtn.disabled = false;
            };
            reader.onerror = function() {
                romStatus.textContent = 'Failed to read file';
                romStatus.style.color = '#f44336';
                log('❌ Failed to read ' + file.name);
                loadBtn.disabled = false;
            };
            reader.readAsArrayBuffer(file);
        }

        // Auto-fill driver name when file is selected
        romFileInput.addEventListener('change', function() {
            var file = this.files[0];
            if (file) {
                var name = file.name.replace(/\.zip$/i, '').toLowerCase();
                driverInput.value = name;
                romStatus.textContent = 'Ready: ' + file.name + ' (driver: ' + name + ')';
                romStatus.style.color = '#aaa';
            }
        });

        window.onerror = function (event, source, lineno, colno, error) {
            Module.setStatus('Exception thrown, see JavaScript console');
            Module.setStatus = function (text) {
                if (text) Module.printErr('[post-exception status] ' + text);
            };
            
            var msg = "window.onerror: " + event + "\n";
            if (source) msg += "Source: " + source + ":" + lineno + ":" + colno + "\n";
            if (error && error.stack) msg += "Stack:\n" + error.stack + "\n";
            
            outputElement.value += "\n[FATAL ERROR]\n" + msg + "\n";
            outputElement.scrollTop = outputElement.scrollHeight;
        };
    </script>
    <script async type="text/javascript" src="mametiny.js"></script>
</body>

</html>
