name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'build.ps1'
      - 'build-linux.ps1'
      - 'custom_targets/**'
      - 'test_*.html'
      - 'server.py'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.35

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc g++ git

      - name: Clone MAME source
        run: |
          git clone --depth 1 --branch mame0287 https://github.com/mamedev/mame.git mame

      - name: Copy custom targets
        run: |
          mkdir -p mame/scripts/target/mame
          cp custom_targets/*.lua mame/scripts/target/mame/ 2>/dev/null || true
          cp custom_targets/*.lst mame/src/mame/ 2>/dev/null || true

      - name: Build native tools (genie)
        run: |
          cd mame
          make -j$(nproc) genie
          cd ..

      - name: Build MAME tiny (WASM)
        run: |
          cd mame
          emmake make -j$(nproc) TARGET=mame SUBTARGET=tiny \
            LDFLAGS="-s ALLOW_MEMORY_GROWTH=1 -s INITIAL_MEMORY=536870912 -s MAXIMUM_MEMORY=4GB -s DISABLE_EXCEPTION_CATCHING=0" \
            DEBUG=0 SYMBOLS=0 NO_USE_MIDI=1 NO_USE_PORTAUDIO=1 NO_USE_PULSEAUDIO=1 NO_USE_SDL2=1 NO_USE_SYSTEM_LIB_ZLIB=1 NO_USE_SYSTEM_LIB_JPEG=1 NO_USE_SYSTEM_LIB_FLAC=1 NO_USE_SYSTEM_LIB_SQLITE3=1
          cd ..

      - name: Find build artifacts
        run: |
          echo "=== Searching for build artifacts ==="
          find mame/build -name "mametiny.js" -o -name "mametiny.wasm" 2>/dev/null
          echo "=== Directory structure ==="
          find mame/build/projects -type d 2>/dev/null | head -30

      - name: Prepare deployment
        run: |
          mkdir -p deploy
          # Find and copy JS and WASM files
          JS_FILE=$(find mame/build -name "mametiny.js" -type f | head -1)
          WASM_FILE=$(find mame/build -name "mametiny.wasm" -type f | head -1)
          if [ -n "$JS_FILE" ]; then
            cp "$JS_FILE" deploy/mametiny.js
            echo "Copied JS from: $JS_FILE"
          else
            echo "ERROR: mametiny.js not found!"
            exit 1
          fi
          if [ -n "$WASM_FILE" ]; then
            cp "$WASM_FILE" deploy/mametiny.wasm
            echo "Copied WASM from: $WASM_FILE"
          else
            echo "ERROR: mametiny.wasm not found!"
            exit 1
          fi
          cp test_mamewasm.html deploy/index.html
          cp test_emularity.html deploy/emularity.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
