<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>MAME WASM - Emularity Test (Robby Roto)</title>
    <!-- Use the proven working loader configuration -->
    <script src="emularity/browserfs.min.js"></script>
    <script src="emularity/loader.js"></script>
    <style>
        /* ... existing styles ... */
    </style>
</head>

<body>
    <h1>MAME WASM Emularity Test (Robby Roto)</h1>
    <p>Note: This page is configured specifically for Robby Roto. Edit this file to test other games.</p>
    <div id="emulator_container">
        <canvas id="canvas"></canvas>
    </div>

    <script>
        // Check if Emularity is loaded
        if (typeof Emulator === 'undefined' && typeof JSMAMELoader === 'undefined') {
            document.body.innerHTML += "<h3 style='color:red;'>Error: Emularity loader not found. Did you run setup.ps1?</h3>";
        } else {
            // Configure the emulator
            // Note: MAME WASM usually requires specific arguments and file mounts.
            // This is a minimal test to see if the binary loads.

            var emulator = new Emulator(document.querySelector("#canvas"),
                null,
                new JSMAMELoader(JSMAMELoader.driver("robby"),
                    JSMAMELoader.nativeResolution(640, 480),
                    JSMAMELoader.emulatorJS("tiny.js"),
                    JSMAMELoader.emulatorWASM("tiny.wasm"),
                    JSMAMELoader.mountFile("robby.zip", JSMAMELoader.fetchFile("Game File", "roms/robby.zip")),
                    JSMAMELoader.extraArgs(["-verbose", "-window", "-video", "soft", "-resolution", "640x480"])
                ));
            emulator.start({ waitAfterDownloading: true });
        }
    </script>
</body>

</html>
