name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'build.ps1'
      - 'build-linux.ps1'
      - 'custom_targets/**'
      - 'test_*.html'
      - 'server.py'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v14
        with:
          version: latest
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc g++ git

      - name: Clone MAME source
        run: |
          git clone --depth 1 --branch mame0288 https://github.com/mamedev/mame.git mame

      - name: Copy custom targets
        run: |
          mkdir -p mame/scripts/target/mame
          cp custom_targets/*.lua mame/scripts/target/mame/ 2>/dev/null || true
          cp custom_targets/*.lst mame/src/mame/ 2>/dev/null || true

      - name: Build native tools (genie)
        run: |
          cd mame
          make -j$(nproc) genie
          cd ..

      - name: Build MAME tiny (WASM)
        run: |
          ulimit -n 65536
          cd mame
          emmake make -j$(nproc) TARGET=mame SUBTARGET=tiny VERBOSE=1 \
            LDFLAGS="-s ALLOW_MEMORY_GROWTH=1 -s INITIAL_MEMORY=1073741824 -s MAXIMUM_MEMORY=4GB -s DISABLE_EXCEPTION_CATCHING=0" \
            DEBUG=0 SYMBOLS=0 NO_USE_MIDI=1 NO_USE_PORTAUDIO=1 NO_USE_PULSEAUDIO=1 NO_USE_SDL2=1 NO_USE_SYSTEM_LIB_ZLIB=1 NO_USE_SYSTEM_LIB_JPEG=1 NO_USE_SYSTEM_LIB_FLAC=1 NO_USE_SYSTEM_LIB_SQLITE3=1
          cd ..

      - name: Find build artifacts
        run: |
          echo "=== All js/wasm files in mame ==="
          find mame -name "*.js" -o -name "*.wasm" 2>/dev/null | head -30
          echo "=== gmake-asmjs directory ==="
          find mame/build/projects/sdl/mametiny/gmake-asmjs -type f 2>/dev/null | head -20

      - name: Download robby.zip
        run: |
          mkdir -p roms
          curl -L -o roms/robby.zip https://www.mamedev.org/roms/robby/robby.zip

      - name: Prepare deployment
        run: |
          mkdir -p deploy/roms
          # Find JS and WASM files anywhere in mame directory
          JS_FILE=$(find mame -name "mametiny.js" -type f | head -1)
          WASM_FILE=$(find mame -name "mametiny.wasm" -type f | head -1)
          if [ -n "$JS_FILE" ]; then
            cp "$JS_FILE" deploy/mametiny.js
            echo "Copied JS from: $JS_FILE"
          else
            echo "ERROR: mametiny.js not found!"
            find mame -name "*.js" -type f 2>/dev/null
            exit 1
          fi
          if [ -n "$WASM_FILE" ]; then
            cp "$WASM_FILE" deploy/mametiny.wasm
            echo "Copied WASM from: $WASM_FILE"
          else
            echo "ERROR: mametiny.wasm not found!"
            find mame -name "*.wasm" -type f 2>/dev/null
            exit 1
          fi
          # Copy ROM for emularity page
          cp roms/robby.zip deploy/roms/robby.zip
          cp test_emularity.html deploy/index.html
          cp test_mamewasm.html deploy/play.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
